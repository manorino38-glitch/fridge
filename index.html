<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="冷蔵庫">
<meta name="theme-color" content="#f6f5f1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>冷蔵庫</title>
<style>
/* ===========================================================================
   デザインの決めごと

   1. 役割ごとに「形」を変える。同じ形が並ぶと、押す前に考える時間が生まれる
        選択肢  … 角丸いっぱいのタグ。枠は細く、色は淡い
        入力欄  … 白地＋しっかりした枠。中に単位を置く
        主ボタン… 幅いっぱいのベタ塗り。画面にひとつだけ
        一覧    … 罫線で区切った行。箱を並べない
   2. 置き場カテゴリに色を割り当てる。色覚特性のシミュレーション込みで
      隣り合う色の識別距離を検証した7色を使う。色だけで意味を伝えず、必ず文字と並べる
   3. 数字は等幅。金額が縦に揃わないと読めない
   ======================================================================== */
:root{
  --bg:#f6f5f1;
  --surface:#ffffff;
  --surface-2:#faf9f6;
  --tint:#f0eee7;
  --line:#e7e4dc;
  --line-2:#d4d0c5;
  --ink:#1b1a17;
  --ink-2:#6f6b62;
  --ink-3:#9c9890;
  --accent:#166b4e;
  --accent-2:#1f8a64;
  --accent-tint:#e6f2ec;
  --danger:#c0392b;
  --danger-tint:#fceeec;
  --warn:#a86a12;
  --warn-tint:#fbf1de;
  --tabh:58px;

  /* 置き場カテゴリ（検証済みの並び。隣どうしが見分けられる順） */
  --k0:#008300; --k1:#2a78d6; --k2:#1baf7a; --k3:#4a3aa7;
  --k4:#e87ba4; --k5:#eda100; --k6:#e34948; --k7:#6f6b62;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
input,button,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- 骨格 ---------- */
.view{display:none;padding:14px 14px calc(var(--tabh) + env(safe-area-inset-bottom) + 130px);min-height:100%}
.view.on{display:block}
body.no-foot .view{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 28px)}

#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(3,1fr);
  background:rgba(255,255,255,.95);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
#tabs button{height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-size:11px;color:var(--ink-3);letter-spacing:.02em}
#tabs button .ic{font-size:18px;line-height:1;font-weight:700}
#tabs button.on{color:var(--accent);font-weight:700}

/* ---------- 見出し ---------- */
.sect{display:flex;align-items:center;gap:8px;margin:22px 2px 9px}
.sect:first-child{margin-top:2px}
.sect h2{margin:0;font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--ink-2)}
.sect .rule{flex:1;height:1px;background:var(--line)}
.sect .hint{font-size:11px;color:var(--ink-3)}

/* ---------- 形1: 選択肢（タグ） ---------- */
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{
  border:1px solid transparent;background:var(--tint);color:#54504a;
  border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;line-height:1
}
.tag.on{background:var(--accent);color:#fff}
.tag.mut{background:transparent;border-color:var(--line-2);color:var(--ink-2);font-weight:500}

/* ---------- 形2: 入力欄 ---------- */
.fld{display:block;margin-bottom:12px}
.fld > span{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--ink-2);margin-bottom:5px}
.inw{position:relative;display:block}
.inw input{
  width:100%;height:50px;padding:0 42px 0 13px;border:1.5px solid var(--line-2);border-radius:12px;
  background:var(--surface);font-size:17px;font-variant-numeric:tabular-nums
}
.inw input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.inw i{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:12px;font-style:normal;
  color:var(--ink-3);font-weight:700;pointer-events:none}
.inw.wide input{padding-right:13px}
input[type=date]{width:100%;height:50px;padding:0 13px;border:1.5px solid var(--line-2);border-radius:12px;
  background:var(--surface);font-size:17px}
select{width:100%;height:50px;padding:0 13px;border:1.5px solid var(--line-2);border-radius:12px;background:var(--surface);font-size:17px}

/* ---------- 形3: 主ボタン ---------- */
.btn{display:block;width:100%;height:54px;border-radius:14px;background:var(--accent);color:#fff;
  font-size:17px;font-weight:800;text-align:center;letter-spacing:.02em;
  box-shadow:0 2px 0 rgba(10,60,42,.22)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(10,60,42,.22)}
.btn:disabled{background:#cfcbc1;color:#fff;box-shadow:none}
.btn.line{background:transparent;color:var(--accent);border:1.5px solid var(--accent);box-shadow:none;height:48px;font-size:15px}
.btn.quiet{background:transparent;color:var(--ink-2);border:1.5px dashed var(--line-2);box-shadow:none;height:48px;font-size:15px;font-weight:700}
.lnk{color:var(--accent);font-size:12px;font-weight:800;text-decoration:underline;text-underline-offset:2px}

/* ---------- 形4: 一覧（行） ---------- */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.prow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow.on{background:var(--accent-tint)}
.prow .dot{width:9px;height:9px;border-radius:50%;flex:none}
.prow .g{flex:1;min-width:0}
.prow .g b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .g span{display:block;font-size:11px;color:var(--ink-3);margin-top:1px}
.prow .r{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}

.muted{color:var(--ink-2)} .small{font-size:12px} .tiny{font-size:11px}
.empty{text-align:center;color:var(--ink-3);padding:44px 20px;font-size:14px;line-height:1.9}

/* ---------- サマリー ---------- */
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}
.monthbar button{width:46px;height:40px;font-size:22px;color:var(--ink-3)}
.monthbar .lbl{font-size:15px;font-weight:800}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 16px 22px;text-align:center;
  background-image:linear-gradient(180deg,var(--accent-tint) 0%,rgba(255,255,255,0) 62%)}
.hero .cap{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--accent)}
.hero .big{font-size:clamp(44px,14vw,60px);font-weight:800;letter-spacing:-.03em;margin:4px 0 3px;line-height:1.02}
.hero .sub{font-size:14px;color:var(--ink-2);font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 13px}
.tile .k{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--ink-2)}
.tile .v{font-size:20px;font-weight:800;margin-top:2px;letter-spacing:-.01em}
.tile .bar{height:3px;border-radius:2px;background:var(--line);margin-top:7px;overflow:hidden}
.tile .bar i{display:block;height:100%;border-radius:2px;background:var(--accent-2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{font-size:14px;color:var(--ink-2)}
.kv .v{font-size:15px;font-weight:700;white-space:nowrap}

.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.bars{display:flex;align-items:flex-end;gap:2px;height:88px}
.bars > div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars b{display:block;width:100%;max-width:14px;border-radius:4px 4px 0 0;background:#bcd9cc;box-shadow:0 0 0 2px var(--surface)}
.bars b.today{background:var(--accent)}
.bars b.on{background:var(--accent-2)}
.bars em{font-style:normal;font-size:9px;color:var(--ink-3);margin-top:4px;font-variant-numeric:tabular-nums}
.chart .read{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2);margin-top:9px;
  border-top:1px solid var(--line);padding-top:9px;font-variant-numeric:tabular-nums}

/* ---------- 今日 ---------- */
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:11px}
.dayhead .t{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--ink-2)}
.dayhead .v{font-size:27px;font-weight:800;letter-spacing:-.02em}
.mealrow{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:11px;overflow:hidden}
.mealrow div{background:var(--surface-2);padding:9px 4px;text-align:center}
.mealrow .k{font-size:10px;font-weight:800;color:var(--ink-2)}
.mealrow .v{font-size:14px;font-weight:800;margin-top:2px}
.mealrow div.z .v{color:var(--ink-3);font-weight:600}
.it{display:grid;grid-template-columns:40px 1fr auto;gap:9px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.it .tm{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.it .g{min-width:0}
.it .g b{font-size:14px;font-weight:700}
.it .g span{font-size:11px;color:var(--ink-3);margin-left:6px;font-variant-numeric:tabular-nums}
.it .amt{font-size:14px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.it.off{opacity:.5}
.it .tag{display:inline-block;font-size:10px;font-weight:800;padding:1px 7px;border-radius:999px;
  background:var(--tint);color:var(--ink-2);margin-left:6px;vertical-align:1px}

/* ---------- 冷蔵庫 ---------- */
.ftop{position:sticky;top:0;z-index:20;background:var(--bg);padding:0 0 12px;margin-top:-2px}
.mealseg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:var(--tint);border-radius:14px;padding:5px}
.mealseg button{height:42px;border-radius:10px;font-size:15px;font-weight:700;color:#6b675f}
.mealseg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.13)}
.mealseg.dim{opacity:.4;pointer-events:none}

.catbar{display:flex;align-items:center;gap:7px;margin:20px 3px 7px}
.catbar .dot{width:10px;height:10px;border-radius:3px;flex:none}
.catbar .nm{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--ink-2)}
.catbar .rule{flex:1;height:1px;background:var(--line)}
.catbar .ct{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;border-left:3px solid var(--cc,var(--line))}

.row{display:grid;grid-template-columns:1fr 58px 58px 38px;gap:7px;align-items:center;
  padding:10px 10px 10px 13px;border-bottom:1px solid var(--line)}
.row.prep{grid-template-columns:1fr 58px 38px}
.row:last-child{border-bottom:0}
.row.act{background:var(--accent-tint)}
.row.waste{background:var(--danger-tint)}
.row .nm{text-align:left;min-width:0;padding:2px 0}
.row .nm .t{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm .s{display:block;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;font-variant-numeric:tabular-nums}
.row.waste .nm .s{color:var(--danger)}
.lotb{display:inline-block;font-style:normal;font-size:10px;font-weight:800;color:#fff;background:var(--ink-3);
  border-radius:999px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.qin{position:relative;display:block}
.qin input{width:100%;height:44px;padding:0 20px 0 7px;text-align:right;border:1.5px solid var(--line-2);
  border-radius:11px;background:var(--surface);font-size:16px;font-variant-numeric:tabular-nums}
.qin input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.qin i{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--ink-3);
  font-style:normal;font-weight:700;pointer-events:none}
.allb{height:44px;width:38px;border:1.5px solid var(--line-2);border-radius:11px;font-size:13px;font-weight:800;color:var(--ink-2)}
.allb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.detail{padding:4px 13px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.detail .lab{font-size:11px;color:var(--ink-2);margin:10px 0 6px;font-weight:800;letter-spacing:.04em}
.lotbtn{display:block;width:100%;text-align:left;border:1.5px solid var(--line-2);border-radius:11px;
  padding:9px 11px;margin-bottom:6px;background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums}
.lotbtn.on{border-color:var(--accent);background:var(--accent-tint);font-weight:700}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}
.acts button{height:40px;border:1.5px solid var(--line-2);border-radius:11px;font-size:13px;font-weight:700;background:var(--surface)}
.acts button.danger.on{background:var(--danger);border-color:var(--danger);color:#fff}

.foot{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));z-index:30;
  background:rgba(255,255,255,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:10px 14px 12px}
.foot .pre{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.foot .pre label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.foot .pre input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.foot .amt{margin-left:auto;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:700}

/* ---------- 仕入: 選択中パネル ---------- */
.pcard{border-radius:16px;overflow:hidden;border:1.5px solid var(--accent);margin-bottom:16px;background:var(--surface);
  box-shadow:0 3px 12px rgba(22,107,78,.10)}
.pcard .hd{display:flex;align-items:center;gap:9px;padding:12px 14px;background:var(--accent-tint);
  border-bottom:1.5px solid var(--accent)}
.pcard .hd .dot{width:10px;height:10px;border-radius:3px;flex:none}
.pcard .hd .nm{font-size:17px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .hd .cat{font-size:11px;color:var(--ink-2);font-weight:700}
.pcard .bd{padding:14px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.duo .fld{margin-bottom:0}
.src{display:block;font-size:10px;font-weight:800;margin-top:5px;min-height:13px;letter-spacing:.03em}
.src.prev{color:var(--warn)}
.src.blank{color:var(--ink-3)}
.perg{font-size:13px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums;margin:12px 0 14px;min-height:19px}

.datewarn{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--warn);margin-top:6px;font-weight:800}
.datewarn:empty{display:none}
.datewarn button{border:1.5px solid var(--warn);color:var(--warn);border-radius:999px;padding:3px 11px;font-size:11px;font-weight:800}

.logrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
.logrow:last-child{border-bottom:0}
.logrow .g{flex:1;min-width:0}
.logrow .g b{font-weight:700}
.logrow .g span{display:block;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.logrow .x{font-size:12px;color:var(--danger);padding:6px 8px;font-weight:800}

/* ---------- モーダル / トースト ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;background:rgba(20,19,17,.4)}
.sheet.on{display:flex}
.sheet .inner{width:100%;background:var(--surface);border-radius:20px 20px 0 0;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 16px;font-size:18px}

#toast{position:fixed;left:14px;right:14px;
  bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + var(--footh, 0px) + 12px);z-index:70;
  display:none;align-items:center;gap:12px;background:#23221d;color:#fff;border-radius:13px;
  padding:13px 15px;font-size:14px;box-shadow:0 8px 26px rgba(0,0,0,.24)}
#toast.on{display:flex}
#toast.err{background:#7d2318}
#toast.err button{color:#ffc9bf}
#toast .msg{flex:1}
#toast button{color:#7fdcb4;font-weight:800;font-size:14px;padding:4px 2px}
#banner{position:fixed;left:0;right:0;top:0;z-index:50;background:var(--warn);color:#fff;
  font-size:12px;text-align:center;padding:7px 12px;display:none;font-weight:700}
#banner.on{display:block}
#setup{padding:36px 20px calc(40px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
#setup h1{font-size:21px;margin:0 0 8px}
#setup p{font-size:13px;color:var(--ink-2);line-height:1.75;margin:0 0 22px}
.spinner{text-align:center;padding:74px 20px;color:var(--ink-3);font-size:14px}
</style>
</head>
<body>

<div id="banner"></div>
<div id="boot" class="spinner">読み込み中…</div>

<div id="setup" hidden>
  <h1>接続設定</h1>
  <p>Google Apps Script 側で <code>setup()</code> を実行すると、実行ログにトークンが出ます。<br>それをここに貼ってください。</p>
  <label class="fld" id="fUrl"><span>ウェブアプリのURL（/exec で終わるもの）</span>
    <div class="inw wide"><input id="iUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocapitalize="off" autocorrect="off"></div></label>
  <label class="fld"><span>APIトークン</span>
    <div class="inw wide"><input id="iTok" type="text" placeholder="setup() のログに出た文字列" autocapitalize="off" autocorrect="off" spellcheck="false"></div></label>
  <div style="height:8px"></div>
  <button class="btn" id="bSave">接続する</button>
  <p id="setupErr" style="color:var(--danger);margin-top:16px"></p>
  <div id="setupWarn" hidden style="margin-top:18px;padding:13px 14px;border-radius:12px;background:var(--warn-tint);border:1px solid var(--warn)">
    <p style="margin:0;font-size:13px;color:var(--warn);line-height:1.8">
      <b>この端末では設定を保存できません。</b><br>
      設定 → アプリ → Safari → 詳細 →「すべてのCookieをブロック」がオンになっていないか確認してください。<br>
      オフにできない場合も、接続したあとに出る「ホーム画面用リンク」を使えば、毎回入力せずに済みます。
    </p>
  </div>
</div>

<div id="app" hidden>
  <section id="v-summary" class="view"></section>
  <section id="v-fridge"  class="view"></section>
  <section id="v-buy"     class="view"></section>

  <div id="foot"></div>

  <nav id="tabs">
    <button data-tab="summary"><span class="ic">¥</span>サマリー</button>
    <button data-tab="fridge" class="on"><span class="ic">▤</span>冷蔵庫</button>
    <button data-tab="buy"><span class="ic">＋</span>仕入</button>
  </nav>
</div>

<div class="sheet" id="sheet"><div class="inner" id="sheetBody"></div></div>
<div id="toast"><span class="msg"></span><button id="toastAct"></button></div>

<script>
'use strict';
/* ============================================================================
 * 通信層
 *   GASがHTMLも配信している場合は google.script.run を使う。
 *   GitHub Pages などに置いた場合は fetch を使う。
 *   fetch の Content-Type は text/plain 固定。application/json にすると
 *   CORSのプリフライトが飛び、GASのウェブアプリは応答できない。
 * ==========================================================================*/
var IS_GAS = (typeof google !== 'undefined' && google.script && google.script.run) ? true : false;

/* この版の番号。version.txt と必ず同じ文字列にすること。
   ずれていたら、端末が古い版を握っているという意味なので入れ替える。 */
var APP_VERSION = '2026-08-11b';

/* ---- 設定の保存先 --------------------------------------------------------
 * localStorage が使えない端末がある（Safariの「すべてのCookieをブロック」など）。
 * 保存できないと毎回そこで詰まるので、
 *   1. URLの # に載せた設定（ホーム画面のアイコンが持ち続ける）
 *   2. localStorage
 * の順で読む。1があれば、保存が一切できない端末でも起動するだけで使える。
 * ------------------------------------------------------------------------*/
var STORAGE_OK = (function () {
  try { localStorage.setItem('fridge.probe', '1'); localStorage.removeItem('fridge.probe'); return true; }
  catch (e) { return false; }
})();

function b64enc(str) { return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64dec(str) {
  var t = str.replace(/-/g, '+').replace(/_/g, '/');
  while (t.length % 4) t += '=';
  return decodeURIComponent(escape(atob(t)));
}

function cfgFromHash() {
  var m = (location.hash || '').match(/[#&]s=([^&]+)/);
  if (!m) return null;
  try {
    var o = JSON.parse(b64dec(m[1]));
    return (o && o.t) ? o : null;
  } catch (e) { return null; }
}

/** ホーム画面に登録するためのリンク。これ自体が設定を持つ */
function cfgLink() {
  var base = location.origin + location.pathname;
  return base + '#s=' + b64enc(JSON.stringify({ u: CFG.url || '', t: CFG.token || '' }));
}

var CFG = (function () {
  var stored = {};
  try { stored = JSON.parse(localStorage.getItem('fridge.cfg') || '{}'); } catch (e) {}
  var fromHash = cfgFromHash();
  // # に設定があればそちらを優先する（保存が効かない端末でも毎回ここから復元できる）
  return fromHash ? { url: fromHash.u || stored.url, token: fromHash.t } : stored;
})();

function saveCfg() {
  try { localStorage.setItem('fridge.cfg', JSON.stringify(CFG)); return true; }
  catch (e) { return false; }
}

function call(action, payload, opId) {
  var req = { action: action, token: CFG.token || '', payload: payload || {}, opId: opId || null };
  if (IS_GAS) {
    return new Promise(function (res, rej) {
      google.script.run
        .withSuccessHandler(function (t) { try { res(JSON.parse(t)); } catch (e) { rej(e); } })
        .withFailureHandler(rej)
        .api(JSON.stringify(req));
    });
  }
  return fetch(CFG.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(req),
    redirect: 'follow',
  }).then(function (r) { return r.json(); });
}

/* ---- 送信キュー --------------------------------------------------------- */
var QKEY = 'fridge.queue';
function qLoad() { try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch (e) { return []; } }
function qSave(q) { try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch (e) {} }
function qPush(item) { var q = qLoad(); q.push(item); qSave(q); paintBanner(); }

function flushQueue() {
  var q = qLoad();
  if (!q.length) return Promise.resolve();
  var item = q[0];
  return call(item.action, item.payload, item.opId).then(function (r) {
    if (r && (r.ok || r.authFailed)) {
      var q2 = qLoad(); q2.shift(); qSave(q2); paintBanner();
      if (q2.length) return flushQueue();
      return refresh(true);
    }
  }).catch(function () {});
}
function paintBanner() {
  var n = qLoad().length;
  var b = document.getElementById('banner');
  b.className = n ? 'on' : '';
  b.textContent = n ? '未送信 ' + n + ' 件（通信できたら自動で送ります）' : '';
}

/* ---- 版の入れ替え -------------------------------------------------------
 * iOSのホーム画面アプリは、更新してもいつまでも古いページを抱えていることがある。
 * 実際に配信されている version.txt と手元の版がずれていたら、
 * キャッシュとサービスワーカーを捨てて読み直す。
 * ------------------------------------------------------------------------*/
function hardReload() {
  var done = function () { location.reload(); };
  var jobs = [];
  if (window.caches) {
    jobs.push(caches.keys().then(function (ks) {
      return Promise.all(ks.map(function (k) { return caches.delete(k); }));
    }));
  }
  if (navigator.serviceWorker) {
    jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
      return Promise.all(rs.map(function (r) { return r.unregister(); }));
    }));
  }
  Promise.all(jobs).then(done, done);
}

var lastVerCheck = 0;
function checkVersion(force) {
  if (IS_GAS) return;
  var now = Date.now();
  if (!force && now - lastVerCheck < 5 * 60 * 1000) return;
  lastVerCheck = now;
  fetch('version.txt?_=' + now, { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (t) {
      if (!t) return;
      t = t.trim();
      if (!t || t === APP_VERSION) return;
      var seen = null;
      try { seen = sessionStorage.getItem('fridge.reloadedTo'); } catch (e) {}
      if (seen === t) return;                       // 入れ替えたのにまだずれる＝無限ループ防止
      try { sessionStorage.setItem('fridge.reloadedTo', t); } catch (e) {}
      hardReload();
    })
    .catch(function () {});
}

/* ============================================================================
 * 状態
 * ==========================================================================*/
var S = {
  tab: 'fridge',
  categories: [], foods: [], lots: [], meals: ['朝','昼','夕','間食'], outKinds: [], units: ['g','ml','個','本','枚'],
  summary: null, day: null, serverDate: '', ym: '',
  meal: '夕', mealTouched: false,
  ent: {}, kind: {}, sel: {}, open: null,
  makePrep: false,
  buyMode: 'lot', buyFood: null, buyQuery: '',
  buyDate: '', buyDateTouched: false,
  buyLog: [],
  expKind: '', expMeal: '',
  pickDay: null,
  loading: false,
};

var $  = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function yen(n) { return '¥' + Math.round(Number(n) || 0).toLocaleString('ja-JP'); }
function yen1(n) { return '¥' + (Math.round((Number(n) || 0) * 10) / 10).toLocaleString('ja-JP'); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function nowStr() { var d = new Date(); return todayStr() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
function opId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function fmtMD(d) { var p = String(d).split('-'); return p.length === 3 ? (Number(p[1]) + '/' + Number(p[2])) : d; }

/* ---- 単位 ---------------------------------------------------------------
 * 単位は食材ごとに持つ。%の計算は単位に依存しないので、仕組みは共通のまま。
 * 表示だけが変わる: 重さ・容量は「100gあたり」、それ以外は「1個あたり」。
 * ------------------------------------------------------------------------*/
function isBulk(u) { return u === 'g' || u === 'ml'; }

function fmtQty(q, u) {
  var v = Math.round((Number(q) || 0) * 10) / 10;
  if (u === 'g'  && v >= 1000) return (Math.round(v / 100) / 10) + 'kg';
  if (u === 'ml' && v >= 1000) return (Math.round(v / 100) / 10) + 'L';
  return v + (u || '');
}
function fmtUnitPrice(perU, u) {
  // 100円を超える単価で小数を出しても読みにくいだけなので丸める（行の幅も稼げる）
  var v = isBulk(u) ? perU * 100 : perU;
  var txt = v >= 100 ? yen(v) : yen1(v);
  return txt + '/' + (isBulk(u) ? '100' + u : (u || ''));
}

/** 記録時刻から食事区分を初期選択する（仕様書5-2） */
function autoMeal() {
  var h = new Date().getHours();
  if (h >= 5 && h < 11) return '朝';
  if (h >= 11 && h < 16) return '昼';
  if (h >= 16 && h < 22) return '夕';
  return '間食';
}

/** 置き場カテゴリの色。設定の並び順で決まる（色だけに意味を持たせず、必ず文字と並べる） */
function catColor(cat) {
  var i = S.categories.indexOf(cat);
  if (i < 0) return 'var(--k7)';
  return 'var(--k' + (i % 8) + ')';
}

/* ============================================================================
 * トースト / モーダル
 * ==========================================================================*/
var toastTimer = null;
function toastErr(msg) { toast(msg, null, null, 7000, true); }
function toast(msg, actionLabel, onAction, ms, isErr) {
  var el = document.getElementById('toast');
  el.classList.toggle('err', !!isErr);
  $('.msg', el).textContent = msg;
  var btn = document.getElementById('toastAct');
  if (actionLabel) { btn.textContent = actionLabel; btn.hidden = false; btn.onclick = function () { hideToast(); onAction(); }; }
  else { btn.hidden = true; btn.onclick = null; }
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, ms || (actionLabel ? 8000 : 2600));
}
function hideToast() { document.getElementById('toast').classList.remove('on'); }

function openSheet(html) {
  document.getElementById('sheetBody').innerHTML = html;
  document.getElementById('sheet').classList.add('on');
}
function closeSheet() { document.getElementById('sheet').classList.remove('on'); }
document.getElementById('sheet').addEventListener('click', function (e) { if (e.target.id === 'sheet') closeSheet(); });

/* ============================================================================
 * 起動
 * ==========================================================================*/
function boot() {
  paintBanner();
  checkVersion(true);
  $('#fUrl').hidden = IS_GAS;
  if (!CFG.token || (!IS_GAS && !CFG.url)) return showSetup();
  // # から復元できたときは、保存が効く端末なら控えておく
  saveCfg();
  loadAll();
}

function showSetup(err) {
  $('#boot').hidden = true; $('#app').hidden = true; $('#setup').hidden = false;
  $('#iUrl').value = CFG.url || '';
  $('#iTok').value = CFG.token || '';
  $('#setupErr').textContent = err || '';
  $('#setupWarn').hidden = STORAGE_OK;
}

$('#bSave').addEventListener('click', function () {
  var raw = $('#iUrl').value.trim();

  // 設定リンク（#s=...）をそのまま貼られた場合は、そこから読み取る
  var m = raw.match(/[#&]s=([^&\s]+)/);
  if (m) {
    try {
      var o = JSON.parse(b64dec(m[1]));
      if (o && o.t) { CFG.url = o.u || ''; CFG.token = o.t; }
    } catch (e) {}
  } else {
    CFG.url = raw;
    CFG.token = $('#iTok').value.trim();
  }

  if (!CFG.token) return ($('#setupErr').textContent = 'トークンを入れてください');
  if (!IS_GAS && !/\/exec\s*$/.test(CFG.url)) return ($('#setupErr').textContent = 'URLは /exec で終わるものを貼ってください');

  saveCfg();
  // 端末に消されにくくするようOSに申請する（対応していない端末では何も起きない）
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  // 以後この端末では、保存が効かなくてもURLから復元できるようにしておく
  try { history.replaceState(null, '', cfgLink()); } catch (e) {}

  $('#setup').hidden = true; $('#boot').hidden = false;
  loadAll();
});

function loadAll() {
  $('#boot').hidden = false;
  S.ym = S.ym || todayStr().slice(0, 7);
  call('bootstrap', { ym: S.ym }).then(function (r) {
    if (!r || !r.ok) {
      if (r && r.authFailed) return showSetup('トークンが違います');
      return showSetup((r && r.error) || '接続できませんでした');
    }
    applyBootstrap(r);
    $('#boot').hidden = true; $('#app').hidden = false;
    S.meal = autoMeal();
    S.buyDate = todayStr();
    S.expKind = S.outKinds[0] || '外食';
    S.expMeal = autoMeal();
    renderAll();
    flushQueue();
  }).catch(function (e) {
    showSetup('接続できませんでした（' + (e && e.message ? e.message : e) + '）');
  });
}

function applyBootstrap(r) {
  S.categories = r.categories || [];
  S.foods = r.foods || [];
  S.lots = r.lots || [];
  S.meals = r.meals || S.meals;
  S.outKinds = r.outKinds || [];
  S.units = r.units || S.units;
  S.summary = r.summary;
  if (r.day) S.day = r.day;
  S.serverDate = r.serverDate;
}

function refresh(silent) {
  return call('bootstrap', { ym: S.ym }).then(function (r) {
    if (r && r.ok) { applyBootstrap(r); renderAll(); }
  }).catch(function () { if (!silent) toast('更新できませんでした'); });
}

/* ============================================================================
 * 在庫の取り回し
 * ==========================================================================*/
function lotById(id) { for (var i = 0; i < S.lots.length; i++) if (S.lots[i].id === id) return S.lots[i]; return null; }
function foodById(id) { for (var i = 0; i < S.foods.length; i++) if (S.foods[i].id === id) return S.foods[i]; return null; }

/** 在庫のあるロットを食材ごとにまとめる。各食材の中は古い順（既定は最古のロット） */
function stockByFood() {
  var m = {};
  S.lots.forEach(function (l) {
    if (l.status !== '在庫あり' || !(l.remain > 0.0005)) return;
    (m[l.foodId] = m[l.foodId] || []).push(l);
  });
  Object.keys(m).forEach(function (k) {
    m[k].sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.id < b.id ? -1 : 1); });
  });
  return m;
}
function currentLot(foodId, lots) {
  var want = S.sel[foodId];
  if (want) for (var i = 0; i < lots.length; i++) if (lots[i].id === want) return lots[i];
  return lots[0];
}

/* ============================================================================
 * 描画
 * ==========================================================================*/
function renderAll() { renderSummary(); renderFridge(); renderBuy(); renderFoot(); syncTabs(); }

function syncTabs() {
  $$('#tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === S.tab); });
  ['summary', 'fridge', 'buy'].forEach(function (t) { $('#v-' + t).classList.toggle('on', t === S.tab); });
  document.body.classList.toggle('no-foot', S.tab !== 'fridge');
  var foot = document.getElementById('foot');
  foot.style.display = (S.tab === 'fridge') ? '' : 'none';
  document.documentElement.style.setProperty('--footh', S.tab === 'fridge' ? (foot.offsetHeight + 'px') : '0px');
}

$('#tabs').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-tab]');
  if (!b) return;
  S.tab = b.dataset.tab;
  if (S.tab === 'buy') { rollDate(); renderBuy(); }
  syncTabs();
  window.scrollTo(0, 0);
});

/* 日付は「アプリを開いた日」ではなく「今この瞬間の日」に追従させる。
   アプリを開きっぱなしで日をまたぐと、前日の日付のまま登録されてしまうため。
   ただし自分で日付を変えたときは、その値を尊重する（過去レシートの連続投入のため）。 */
function rollDate() { if (!S.buyDateTouched) S.buyDate = todayStr(); }
function dateWarnHtml() {
  return (S.buyDate && S.buyDate !== todayStr())
    ? '今日（' + fmtMD(todayStr()) + '）ではありません<button type="button" id="bToday">今日にする</button>' : '';
}
function paintDateWarn() {
  var el = $('#dateWarn');
  if (!el) return;
  el.innerHTML = dateWarnHtml();
  var b = $('#bToday');
  if (b) b.onclick = function () { S.buyDateTouched = false; S.buyDate = todayStr(); renderBuy(); };
}
function dateFieldHtml(id, label) {
  return '<label class="fld"><span>' + label + '</span>' +
    '<input id="' + id + '" type="date" value="' + esc(S.buyDate || todayStr()) + '">' +
    '<div class="datewarn" id="dateWarn">' + dateWarnHtml() + '</div></label>';
}

/* ---------------------------------------------------------------- サマリー */
function renderSummary() {
  var s = S.summary, el = $('#v-summary');
  if (!s) { el.innerHTML = '<div class="empty">—</div>'; return; }
  var y = s.ym.slice(0, 4), m = Number(s.ym.slice(5, 7));
  var mp = s.mealPerDay || {};
  var mx = Math.max(mp['朝'] || 0, mp['昼'] || 0, mp['夕'] || 0, mp['間食'] || 0, 1);

  el.innerHTML =
    '<div class="monthbar">' +
      '<button data-mv="-1">‹</button><div class="lbl num">' + y + '年' + m + '月</div><button data-mv="1">›</button>' +
    '</div>' +

    '<div class="hero">' +
      '<div class="cap">' + m + '月の食費</div>' +
      '<div class="big num">' + yen(s.total) + '</div>' +
      '<div class="sub num">1日平均 ' + yen(s.perDay) + '<span class="tiny" style="color:var(--ink-3)">（' + s.days + '日）</span></div>' +
    '</div>' +


    todayHtml() +

    '<div class="sect"><h2>今月の内訳</h2><div class="rule"></div></div>' +
    '<div class="tiles" style="margin-bottom:10px">' +
      ['朝', '昼', '夕', '間食'].map(function (k) {
        var v = mp[k] || 0;
        return '<div class="tile"><div class="k">' + k + '<span class="tiny" style="font-weight:600;color:var(--ink-3)"> 1日平均</span></div>' +
               '<div class="v num">' + yen(v) + '</div>' +
               '<div class="bar"><i style="width:' + Math.round(v / mx * 100) + '%"></i></div></div>';
      }).join('') +
    '</div>' +
    '<div class="panel">' +
      '<div class="kv"><span class="k">自炊</span><span class="v num">' + yen(s.homeCook) + '</span></div>' +
      '<div class="kv"><span class="k">外食</span><span class="v num">' + yen(s.eatOut) +
        ' <span class="tiny" style="color:var(--ink-3)">' + s.eatOutRatio + '%</span></span></div>' +
      '<div class="kv"><span class="k">冷蔵庫の在庫金額</span><span class="v num">' + yen(s.stockValue) + '</span></div>' +
      (s.waste ? '<div class="kv"><span class="k">廃棄（食費には含めない）</span><span class="v num" style="color:var(--danger)">' + yen(s.waste) + '</span></div>' : '') +
      (s.byMeal && s.byMeal['未分類'] ? '<div class="kv"><span class="k">食事区分なし</span><span class="v num">' + yen(s.byMeal['未分類']) + '</span></div>' : '') +
    '</div>' +

    '<div class="sect"><h2>日ごと</h2><div class="rule"></div><span class="hint">棒をタップ</span></div>' +
    '<div class="chart">' + barsHtml(s) + '</div>' +

    '<div style="margin-top:20px;display:grid;gap:9px">' +
      '<button class="btn line" id="bRefresh">最新に更新</button>' +
      '<button class="btn quiet" id="bSettings">設定</button>' +
    '</div>';

  paintDayRead();
}

/**
 * 今日ぶんの明細。
 * 「登録できたのか分からない」を無くすのが目的なので、
 * 記録した行をそのまま時刻順に並べる。廃棄と作り置きへの振替も、
 * 食費には入れないが薄く出す（記録された事実は見せる）。
 */
function todayHtml() {
  if (S.ym !== todayStr().slice(0, 7)) return '';
  var d = S.day;
  var m = (d && d.meals) || { '朝': 0, '昼': 0, '夕': 0, '間食': 0 };

  var tiles = ['朝', '昼', '夕', '間食'].map(function (k) {
    var v = m[k] || 0;
    return '<div' + (v ? '' : ' class="z"') + '><div class="k">' + k + '</div><div class="v num">' + yen(v) + '</div></div>';
  }).join('');

  var list;
  if (!d || !d.items || !d.items.length) {
    list = '<div class="empty" style="padding:26px 10px">まだ今日の記録はありません</div>';
  } else {
    list = d.items.map(function (x) {
      var qty = x.qty ? '<span>' + esc(fmtQty(x.qty, x.unit)) + '</span>' : '';
      var tag = '';
      if (!x.counted) tag = '<span class="tag">' + esc(x.kind === '作り置きへ振替' ? '作り置きへ' : x.kind) + '</span>';
      else if (x.from === '在庫外') tag = '<span class="tag">' + esc(x.kind) + '</span>';
      return '<div class="it' + (x.counted ? '' : ' off') + '">' +
        '<span class="tm">' + esc(x.time || '') + '</span>' +
        '<span class="g"><b>' + esc(x.name) + '</b>' + qty + tag +
          (x.meal ? '<span>' + esc(x.meal) + '</span>' : '') + '</span>' +
        '<span class="amt">' + (x.counted ? yen(x.yen) : '<span style="color:var(--ink-3)">—</span>') + '</span>' +
        '</div>';
    }).join('');
  }

  return '<div class="sect"><h2>今日</h2><div class="rule"></div>' +
           '<span class="hint num">' + fmtMD(todayStr()) + '</span></div>' +
         '<div class="panel" style="padding:14px">' +
           '<div class="dayhead"><span class="t">今日の食費</span><span class="v num">' + yen(d ? d.total : 0) + '</span></div>' +
           '<div class="mealrow">' + tiles + '</div>' +
           list +
         '</div>';
}

/** 日別の棒。1系列なので凡例は不要。タップでその日の内訳を出す */
function barsHtml(s) {
  var y = Number(s.ym.slice(0, 4)), m = Number(s.ym.slice(5, 7));
  var dim = new Date(y, m, 0).getDate();
  var isCur = s.ym === todayStr().slice(0, 7);
  var days = isCur ? Number(todayStr().slice(8, 10)) : dim;
  var vals = [], max = 0;
  for (var d = 1; d <= days; d++) {
    var key = s.ym + '-' + pad(d);
    var v = s.byDate && s.byDate[key] ? s.byDate[key].total : 0;
    vals.push(v); if (v > max) max = v;
  }
  if (!max) return '<div class="empty">まだ記録がありません</div>';

  var bars = vals.map(function (v, i) {
    var day = i + 1;
    var key = s.ym + '-' + pad(day);
    var h = v > 0 ? Math.max(3, Math.round(v / max * 74)) : 2;
    var cls = (key === todayStr()) ? ' today' : (S.pickDay === key ? ' on' : '');
    var lab = (day === 1 || day % 5 === 0) ? day : '';
    return '<div data-day="' + key + '"><b class="' + cls.trim() + '" style="height:' + h + 'px"></b>' +
           '<em>' + lab + '</em></div>';
  }).join('');

  return '<div class="bars" id="bars">' + bars + '</div>' +
         '<div class="read" id="dayRead"></div>';
}

function paintDayRead() {
  var el = $('#dayRead');
  if (!el) return;
  var s = S.summary;
  var key = S.pickDay || todayStr();
  var d = s.byDate && s.byDate[key];
  if (!d) { el.innerHTML = '<span>' + fmtMD(key) + '</span><span>記録なし</span>'; return; }
  var parts = ['朝', '昼', '夕', '間食'].filter(function (k) { return d.meals[k]; })
    .map(function (k) { return k + ' ' + yen(d.meals[k]); });
  el.innerHTML = '<span>' + fmtMD(key) + '　' + (parts.join(' · ') || '—') + '</span>' +
                 '<span style="font-weight:800;color:var(--ink)">' + yen(d.total) + '</span>';
}

$('#v-summary').addEventListener('click', function (e) {
  var mv = e.target.closest('[data-mv]');
  if (mv) {
    var dd = Number(mv.dataset.mv);
    var y = Number(S.ym.slice(0, 4)), m = Number(S.ym.slice(5, 7)) + dd;
    if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
    S.ym = y + '-' + pad(m); S.pickDay = null;
    renderSummary();
    call('summary', { ym: S.ym }).then(function (r) { if (r && r.ok) { S.summary = r.summary; renderSummary(); } });
    return;
  }
  var bar = e.target.closest('[data-day]');
  if (bar) {
    S.pickDay = bar.dataset.day;
    $$('#bars b').forEach(function (b) { b.classList.remove('on'); });
    var mark = $('b', bar);
    if (mark && !mark.classList.contains('today')) mark.classList.add('on');
    paintDayRead();
    return;
  }
  if (e.target.id === 'bRefresh') { toast('更新中…'); refresh().then(function () { toast('更新しました'); }); return; }
  if (e.target.id === 'bSettings') { showSettings(); return; }
});

/* ----------------------------------------------------------------- 冷蔵庫 */
function renderFridge() {
  var el = $('#v-fridge');
  var stock = stockByFood();
  var foodIds = Object.keys(stock);

  var head =
    '<div class="ftop"><div class="mealseg' + (S.makePrep ? ' dim' : '') + '" id="mealSeg">' +
      S.meals.map(function (m) { return '<button data-meal="' + m + '"' + (m === S.meal ? ' class="on"' : '') + '>' + m + '</button>'; }).join('') +
    '</div></div>';

  if (!foodIds.length) {
    el.innerHTML = head + '<div class="empty">在庫がありません。<br>「仕入」タブから買ったものを登録してください。</div>';
    return;
  }

  var groups = {};
  foodIds.forEach(function (fid) {
    var f = foodById(fid);
    var cat = (f && f.category) || 'その他';
    (groups[cat] = groups[cat] || []).push(fid);
  });
  var order = S.categories.slice();
  Object.keys(groups).forEach(function (c) { if (order.indexOf(c) < 0) order.push(c); });

  var html = head;
  order.forEach(function (cat) {
    var ids = groups[cat];
    if (!ids || !ids.length) return;
    ids.sort(function (a, b) {
      var fa = foodById(a), fb = foodById(b);
      return String(fa && fa.name).localeCompare(String(fb && fb.name), 'ja');
    });
    var c = catColor(cat);
    html += '<div class="catbar"><span class="dot" style="background:' + c + '"></span>' +
              '<span class="nm">' + esc(cat) + '</span><span class="rule"></span>' +
              '<span class="ct">' + ids.length + '</span></div>' +
            '<div class="list" style="--cc:' + c + '">' +
              ids.map(function (fid) { return rowHtml(fid, stock[fid], cat); }).join('') +
            '</div>';
  });
  el.innerHTML = html;
}

function rowHtml(foodId, lots, cat) {
  var lot = currentLot(foodId, lots);
  var f = foodById(foodId);
  var name = (f && f.name) || lot.name;
  var unit = lot.unit || (f && f.unit) || 'g';
  var isPrep = (cat === '作り置き');
  var pctLeft = lot.qty ? Math.round(lot.remain / lot.qty * 100) : 0;

  var q = S.ent[lot.id] || 0;
  var pctVal = q && lot.remain ? Math.round(q / lot.remain * 100) : '';
  var qVal = q ? (Math.round(q * 10) / 10) : '';
  var isWaste = S.kind[lot.id] === '廃棄';
  var isAll = q > 0 && Math.abs(q - lot.remain) < 0.005;

  // 作り置きは内容量100の%管理。数量欄を出しても%と同じ数字になるので%だけにする
  var sub = isPrep
    ? (fmtMD(lot.date) + '作成 · ' + yen(lot.yen) + ' · 残り' + pctLeft + '%')
    : ('残り' + pctLeft + '% · ' + fmtQty(lot.remain, unit) + ' · ' + fmtUnitPrice(lot.perU, unit));

  var badge = lots.length > 1 ? '<em class="lotb">' + lots.length + '</em>' : '';
  var open = S.open === foodId;

  var row =
    '<div class="row' + (isPrep ? ' prep' : '') + (q > 0 ? ' act' : '') + (isWaste && q > 0 ? ' waste' : '') +
      '" data-food="' + esc(foodId) + '" data-lot="' + esc(lot.id) + '">' +
      '<button class="nm" data-act="detail"><span class="t">' + esc(name) + badge + '</span>' +
        '<span class="s">' + esc(sub) + '</span></button>' +
      '<label class="qin"><input inputmode="decimal" enterkeyhint="done" data-k="pct" value="' + pctVal + '"><i>%</i></label>' +
      (isPrep ? '' :
      '<label class="qin"><input inputmode="decimal" enterkeyhint="done" data-k="q" value="' + qVal + '"><i>' + esc(unit) + '</i></label>') +
      '<button class="allb' + (isAll ? ' on' : '') + '" data-act="all">全</button>' +
    '</div>';

  if (!open) return row;

  var detail = '<div class="detail" data-food="' + esc(foodId) + '">';
  if (lots.length > 1) {
    detail += '<div class="lab">どのロットから引くか（既定は最も古い在庫）</div>' +
      lots.map(function (l, i) {
        return '<button class="lotbtn' + (l.id === lot.id ? ' on' : '') + '" data-act="pick" data-pick="' + esc(l.id) + '">' +
          fmtMD(l.date) + ' · ' + fmtQty(l.remain, l.unit) + ' / ' + fmtQty(l.qty, l.unit) +
          ' · ' + fmtUnitPrice(l.perU, l.unit) + (i === 0 ? '　<span style="color:var(--ink-3)">最古</span>' : '') +
          '</button>';
      }).join('');
  }
  detail +=
    '<div class="acts">' +
      '<button data-act="all2">使い切り</button>' +
      '<button class="danger' + (isWaste ? ' on' : '') + '" data-act="waste">捨てた</button>' +
      '<button data-act="clear">入力を消す</button>' +
    '</div>' +
    '<div class="lab" style="margin-top:12px">このロット: ' + fmtQty(lot.qty, unit) + ' / ' + yen(lot.yen) +
      ' で ' + fmtMD(lot.date) + ' 購入</div>' +
    (isPrep ? '' : '<button class="lnk" data-act="editfood">単位や置き場を変える</button>') +
    '</div>';
  return row + detail;
}

$('#v-fridge').addEventListener('click', function (e) {
  var mb = e.target.closest('#mealSeg button');
  if (mb) {
    S.meal = mb.dataset.meal; S.mealTouched = true;
    $$('#mealSeg button').forEach(function (b) { b.classList.toggle('on', b === mb); });
    return;
  }
  var btn = e.target.closest('[data-act]');
  if (!btn) return;
  var host = btn.closest('.row') || btn.closest('.detail');
  var foodId = host.dataset.food;
  var stock = stockByFood();
  var lots = stock[foodId] || [];
  var lot = currentLot(foodId, lots);
  var act = btn.dataset.act;

  if (act === 'detail') { S.open = (S.open === foodId ? null : foodId); renderFridge(); return; }
  if (act === 'pick')   { S.sel[foodId] = btn.dataset.pick; renderFridge(); renderFoot(); return; }
  if (act === 'editfood') { showEditFood(foodId); return; }
  if (act === 'all' || act === 'all2') {
    var cur = S.ent[lot.id] || 0;
    if (Math.abs(cur - lot.remain) < 0.005) delete S.ent[lot.id];
    else S.ent[lot.id] = lot.remain;
    renderFridge(); renderFoot(); return;
  }
  if (act === 'waste') {
    if (S.kind[lot.id] === '廃棄') delete S.kind[lot.id];
    else { S.kind[lot.id] = '廃棄'; if (!S.ent[lot.id]) S.ent[lot.id] = lot.remain; }
    renderFridge(); renderFoot(); return;
  }
  if (act === 'clear') { delete S.ent[lot.id]; delete S.kind[lot.id]; renderFridge(); renderFoot(); return; }
});

/* %と数量は相互に連動させる。食材によって自然な単位が違うため両方受け付ける（仕様書5-2） */
$('#v-fridge').addEventListener('input', function (e) {
  var inp = e.target.closest('input[data-k]');
  if (!inp) return;
  var host = inp.closest('.row');
  var lot = lotById(host.dataset.lot);
  if (!lot) return;
  var v = parseFloat(inp.value), k = inp.dataset.k;

  if (!(v > 0)) delete S.ent[lot.id];
  else if (k === 'pct') S.ent[lot.id] = Math.min(lot.remain, Math.round(lot.remain * v / 100 * 1000) / 1000);
  else S.ent[lot.id] = Math.min(lot.remain, v);

  var q = S.ent[lot.id] || 0;
  var other = $('input[data-k="' + (k === 'pct' ? 'q' : 'pct') + '"]', host);
  if (other) other.value = !q ? '' : (k === 'pct' ? (Math.round(q * 10) / 10) : (lot.remain ? Math.round(q / lot.remain * 100) : ''));

  host.classList.toggle('act', q > 0);
  host.classList.toggle('waste', q > 0 && S.kind[lot.id] === '廃棄');
  var ab = $('.allb', host);
  if (ab) ab.classList.toggle('on', q > 0 && Math.abs(q - lot.remain) < 0.005);
  renderFoot();
});

/* ------------------------------------------------------------- 記録フッター */
function pendingList() {
  return Object.keys(S.ent).filter(function (id) { return S.ent[id] > 0; }).map(function (id) {
    return { lotId: id, qty: S.ent[id], kind: S.kind[id] || '消費', lot: lotById(id) };
  }).filter(function (x) { return x.lot; });
}

function renderFoot() {
  var el = document.getElementById('foot');
  var p = pendingList();
  var sum = p.reduce(function (a, x) { return a + x.qty * x.lot.perU; }, 0);
  var w = p.filter(function (x) { return x.kind === '廃棄'; }).reduce(function (a, x) { return a + x.qty * x.lot.perU; }, 0);

  el.className = 'foot';
  el.innerHTML =
    '<div class="pre">' +
      '<label><input type="checkbox" id="cPrep"' + (S.makePrep ? ' checked' : '') + '>作り置きにする</label>' +
      '<span class="amt">' + (p.length
        ? p.length + '件 ' + yen1(sum) + (w ? '（うち廃棄 ' + yen1(w) + '）' : '')
        : '今日 ' + yen(S.day ? S.day.total : 0)) + '</span>' +
    '</div>' +
    '<button class="btn" id="bRec"' + (p.length && !S.loading ? '' : ' disabled') + '>' +
      (S.loading ? '記録中…' : (S.makePrep ? '作り置きにする' : 'まとめて記録')) + '</button>';

  if (S.tab === 'fridge') document.documentElement.style.setProperty('--footh', el.offsetHeight + 'px');

  $('#cPrep').onchange = function () {
    S.makePrep = this.checked;
    if ($('#mealSeg')) $('#mealSeg').classList.toggle('dim', S.makePrep);
    renderFoot();
  };
  $('#bRec').onclick = doRecord;
}

function doRecord() {
  var p = pendingList();
  if (!p.length) return;

  if (S.makePrep) {
    var cost = p.reduce(function (a, x) { return a + x.qty * x.lot.perU; }, 0);
    openSheet(
      '<h3>作り置きにする</h3>' +
      '<p class="small muted" style="margin:-8px 0 16px;line-height:1.8">材料 ' + p.length + '件・' + yen1(cost) + ' 分をひとつの在庫にします。' +
      'この分は今日の食費には計上されず、食べた日に計上されます。</p>' +
      '<label class="fld"><span>品名</span><div class="inw wide"><input id="pName" placeholder="カレー" autocapitalize="off"></div></label>' +
      '<div style="height:6px"></div><button class="btn" id="pGo">作る</button>'
    );
    setTimeout(function () { $('#pName').focus(); }, 100);
    $('#pGo').onclick = function () {
      var n = $('#pName').value.trim();
      if (!n) return;
      closeSheet(); send(p, n);
    };
    return;
  }
  send(p, '');
}

function send(p, prepName) {
  var recMeal = S.meal;              // 記録後に自動判定へ戻すので、表示用に控えておく
  var payload = {
    meal: recMeal, datetime: nowStr(),
    makePrep: !!prepName, prepName: prepName,
    entries: p.map(function (x) { return { lotId: x.lotId, qty: x.qty, kind: x.kind }; }),
  };
  var oid = opId();

  // 画面を先に更新する。GASの返事は待たない（仕様書3章）
  var snap = p.map(function (x) { return { id: x.lotId, remain: x.lot.remain, status: x.lot.status }; });
  p.forEach(function (x) {
    var lot = lotById(x.lotId);
    lot.remain = Math.max(0, Math.round((lot.remain - x.qty) * 1000) / 1000);
    if (lot.remain <= 0.0005) lot.status = '使い切り';
  });
  var localCost = p.reduce(function (a, x) { return a + x.qty * x.lot.perU; }, 0);
  if (prepName) {
    S.lots.push({ id: 'tmp' + oid, date: todayStr(), foodId: 'tmp' + oid, name: prepName, unit: '%',
                  qty: 100, yen: localCost, perU: localCost / 100, remain: 100, status: '在庫あり', source: '作り置き' });
    S.foods.push({ id: 'tmp' + oid, name: prepName, category: '作り置き', unit: '%', tracked: true, lastQty: 100, lastYen: 0, lastBuy: '' });
  }
  // 1回の記録が終わったら、食事区分は時刻の自動判定に戻す
  S.ent = {}; S.kind = {}; S.open = null; S.makePrep = false;
  S.mealTouched = false; S.meal = autoMeal();
  renderFridge(); renderFoot();

  S.loading = true; renderFoot();
  call('record', payload, oid).then(function (r) {
    S.loading = false;
    if (!r || !r.ok) {
      snap.forEach(function (s) { var l = lotById(s.id); if (l) { l.remain = s.remain; l.status = s.status; } });
      renderFridge(); renderFoot();
      toastErr((r && r.error) || '記録できませんでした');
      return;
    }
    (r.lots || []).forEach(function (nl) { var l = lotById(nl.id); if (l) { l.remain = nl.remain; l.status = nl.status; } });
    if (r.prepLot) {
      S.lots = S.lots.filter(function (l) { return l.id !== 'tmp' + oid; });
      S.foods = S.foods.filter(function (f) { return f.id !== 'tmp' + oid; });
      S.lots.push(r.prepLot);
      if (!foodById(r.prepLot.foodId)) {
        S.foods.push({ id: r.prepLot.foodId, name: r.prepLot.name, category: '作り置き', unit: '%',
                       tracked: true, lastQty: 100, lastYen: 0, lastBuy: '' });
      }
    }
    if (r.summary && r.summary.ym === S.ym) S.summary = r.summary;
    if (r.day) S.day = r.day;
    renderFridge(); renderFoot(); renderSummary();

    var label = prepName ? ('「' + prepName + '」を作りました') : (yen1(localCost) + ' を' + recMeal + 'に記録しました');
    toast(label, '取り消す', function () {
      call('undo', { consIds: r.consIds, prepLotId: r.prepLot ? r.prepLot.id : null }, opId()).then(function (u) {
        if (u && u.ok) { refresh(true); toast('取り消しました'); } else toastErr('取り消せませんでした');
      });
    });
  }).catch(function () {
    S.loading = false;
    qPush({ action: 'record', payload: payload, opId: oid });
    renderFoot();
    toast('通信できないので端末に保存しました', null, null, 5000, true);
  });
}

/* -------------------------------------------------------------------- 仕入 */
function renderBuy() {
  var el = $('#v-buy');
  el.innerHTML =
    '<div class="mealseg" id="buySeg" style="grid-template-columns:1fr 1fr;margin-bottom:16px">' +
      '<button data-bm="lot"' + (S.buyMode === 'lot' ? ' class="on"' : '') + '>食材の仕入</button>' +
      '<button data-bm="out"' + (S.buyMode === 'out' ? ' class="on"' : '') + '>在庫外支出</button>' +
    '</div>' +
    (S.buyMode === 'lot' ? buyLotHtml() : buyOutHtml()) +
    buyLogHtml();
  bindBuy();
}

function buyLotHtml() {
  var q = S.buyQuery.trim();
  var list = S.foods.filter(function (f) { return f.category !== '作り置き'; });
  if (q) list = list.filter(function (f) { return f.name.indexOf(q) >= 0 || (f.aliases || '').indexOf(q) >= 0; });
  list.sort(function (a, b) {
    var x = a.lastBuy || '', y = b.lastBuy || '';
    if (x !== y) return x > y ? -1 : 1;
    return String(a.name).localeCompare(String(b.name), 'ja');
  });
  list = list.slice(0, 60);

  var f = S.buyFood ? foodById(S.buyFood) : null;
  var panel = '';
  if (f) {
    panel =
      '<div class="pcard">' +
        '<div class="hd">' +
          '<span class="dot" style="background:' + catColor(f.category) + '"></span>' +
          '<span class="nm">' + esc(f.name) + '</span>' +
          '<span class="cat">' + esc(f.category) + '</span>' +
          '<button class="lnk" id="bEditFood">編集</button>' +
        '</div>' +
        '<div class="bd">' +
          '<div class="duo">' +
            '<label class="fld"><span>内容量</span>' +
              '<div class="inw"><input id="bQ" inputmode="decimal" enterkeyhint="next" value="' + (f.lastQty || '') + '"><i>' + esc(f.unit) + '</i></div>' +
              '<em class="src ' + (f.lastQty ? 'prev' : 'blank') + '">' + (f.lastQty ? '前回値' : '初めての食材') + '</em></label>' +
            '<label class="fld"><span>金額</span>' +
              '<div class="inw"><input id="bY" inputmode="decimal" enterkeyhint="done" value="' + (f.lastYen || '') + '"><i>円</i></div>' +
              '<em class="src ' + (f.lastYen ? 'prev' : 'blank') + '">' + (f.lastYen ? '前回値' : '　') + '</em></label>' +
          '</div>' +
          '<div class="perg" id="bPerU">&nbsp;</div>' +
          '<button class="btn" id="bLotGo">登録する</button>' +
        '</div>' +
      '</div>';
  }

  return panel +
    dateFieldHtml('bDate', '購入日（過去の日付も入れられます）') +
    '<div class="sect"><h2>食材</h2><div class="rule"></div><span class="hint">最近買った順</span></div>' +
    '<label class="fld"><div class="inw wide"><input id="bQuery" type="search" placeholder="絞り込み" value="' + esc(S.buyQuery) + '" autocapitalize="off"></div></label>' +
    (list.length
      ? '<div class="rows" id="pickRows">' + list.map(function (x) {
          return '<button class="prow' + (x.id === S.buyFood ? ' on' : '') + '" data-food="' + esc(x.id) + '">' +
            '<span class="dot" style="background:' + catColor(x.category) + '"></span>' +
            '<span class="g"><b>' + esc(x.name) + '</b><span>' + esc(x.category) + '</span></span>' +
            '<span class="r">' + (x.lastQty ? fmtQty(x.lastQty, x.unit) + ' / ' + yen(x.lastYen) : '初めて') + '</span>' +
            '</button>';
        }).join('') + '</div>'
      : '<div class="empty">見つかりません</div>') +
    '<div style="height:12px"></div>' +
    '<button class="btn quiet" id="bNewFood">＋ 新しい食材を登録</button>';
}

function buyOutHtml() {
  var kinds = S.outKinds.length ? S.outKinds : ['外食', '飲料', '調味料', '米', '菓子', 'その他'];
  return dateFieldHtml('oDate', '日付') +
    '<div class="fld"><span>区分</span><div class="tags" id="oKinds">' +
      kinds.map(function (k) { return '<button class="tag' + (k === S.expKind ? ' on' : '') + '" data-ok="' + esc(k) + '">' + esc(k) + '</button>'; }).join('') +
    '</div></div>' +
    '<div class="fld"><span>食事区分（外食でなくても選べます）</span><div class="tags" id="oMeals">' +
      S.meals.map(function (m) { return '<button class="tag' + (m === S.expMeal ? ' on' : '') + '" data-om="' + esc(m) + '">' + esc(m) + '</button>'; }).join('') +
      '<button class="tag mut' + (S.expMeal === '' ? ' on' : '') + '" data-om="">なし</button>' +
    '</div></div>' +
    '<label class="fld"><span>店名・品名</span><div class="inw wide"><input id="oName" placeholder="例: 松屋 / 紙パックのジュース"></div></label>' +
    '<label class="fld"><span>金額</span><div class="inw"><input id="oYen" inputmode="decimal" enterkeyhint="done"><i>円</i></div></label>' +
    '<div style="height:6px"></div>' +
    '<button class="btn" id="bOutGo">登録する</button>' +
    '<p class="tiny muted" style="margin:16px 2px 0;line-height:1.9">調味料・油・米・粉・乾物・飲料は、買った日に全額を計上して終わりです。使うたびの記録はしません。<br>' +
    '「朝食のつもりで飲んだジュース」のように、外食でなくても食事区分を付けられます。</p>';
}

function buyLogHtml() {
  if (!S.buyLog.length) return '';
  return '<div class="sect"><h2>この画面で登録したもの</h2><div class="rule"></div></div><div class="rows">' +
    S.buyLog.slice().reverse().map(function (x, i) {
      return '<div class="logrow"><div class="g"><b>' + esc(x.label) + '</b><span>' + esc(x.sub) + '</span></div>' +
        '<button class="x" data-undo="' + (S.buyLog.length - 1 - i) + '">取り消す</button></div>';
    }).join('') + '</div>';
}

function bindBuy() {
  var seg = $('#buySeg');
  if (seg) seg.onclick = function (e) {
    var b = e.target.closest('[data-bm]'); if (!b) return;
    S.buyMode = b.dataset.bm; renderBuy();
  };

  var q = $('#bQuery');
  if (q) q.oninput = function () {
    var focused = document.activeElement === q;
    S.buyQuery = this.value;
    renderBuy();
    if (focused) { var n = $('#bQuery'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
  };

  var onDate = function () { S.buyDate = this.value; S.buyDateTouched = true; paintDateWarn(); };
  var dt = $('#bDate'); if (dt) dt.onchange = onDate;
  var od = $('#oDate'); if (od) od.onchange = onDate;
  paintDateWarn();

  var rows = $('#pickRows');
  if (rows) rows.onclick = function (e) {
    var b = e.target.closest('[data-food]'); if (!b) return;
    S.buyFood = (S.buyFood === b.dataset.food) ? null : b.dataset.food;
    renderBuy(); window.scrollTo(0, 0);
  };

  var f = S.buyFood ? foodById(S.buyFood) : null;
  var perU = function () {
    var el = $('#bPerU'); if (!el || !f) return;
    var a = parseFloat(($('#bQ') || {}).value), y = parseFloat(($('#bY') || {}).value);
    el.textContent = (a > 0 && y >= 0) ? ('= ' + fmtUnitPrice(y / a, f.unit)) : ' ';
  };
  if ($('#bQ')) { $('#bQ').oninput = perU; $('#bY').oninput = perU; perU(); }

  var ef = $('#bEditFood');
  if (ef) ef.onclick = function () { showEditFood(S.buyFood); };

  var go = $('#bLotGo');
  if (go) go.onclick = function () {
    var qty = parseFloat($('#bQ').value), y = parseFloat($('#bY').value);
    if (!(qty > 0)) return toastErr('内容量を入れてください');
    if (!(y >= 0)) return toastErr('金額を入れてください');
    var date = ($('#bDate') || {}).value || todayStr();
    var item = { foodId: f.id, qty: qty, yen: y, unit: f.unit, date: date, source: '手入力' };
    var oid = opId();
    go.disabled = true;
    call('addLots', { items: [item] }, oid).then(function (r) {
      go.disabled = false;
      if (!r || !r.ok) return toastErr((r && r.error) || '登録できませんでした');
      r.lots.forEach(function (l) { S.lots.push(l); });
      f.lastQty = qty; f.lastYen = y; f.lastBuy = date;
      S.buyLog.push({ label: f.name, sub: fmtMD(date) + ' · ' + fmtQty(qty, f.unit) + ' · ' + yen(y),
                      lotIds: r.lots.map(function (l) { return l.id; }) });
      S.buyFood = null; S.buyQuery = '';
      renderBuy(); renderFridge();
      toast(f.name + ' を登録しました');
    }).catch(function () {
      go.disabled = false;
      qPush({ action: 'addLots', payload: { items: [item] }, opId: oid });
      toast('通信できないので端末に保存しました', null, null, 5000, true);
    });
  };

  var nf = $('#bNewFood');
  if (nf) nf.onclick = function () { showFoodSheet(null); };

  var ok = $('#oKinds');
  if (ok) ok.onclick = function (e) {
    var b = e.target.closest('[data-ok]'); if (!b) return;
    S.expKind = b.dataset.ok;
    $$('#oKinds .tag').forEach(function (c) { c.classList.toggle('on', c === b); });
  };
  var om = $('#oMeals');
  if (om) om.onclick = function (e) {
    var b = e.target.closest('[data-om]'); if (!b) return;
    S.expMeal = b.dataset.om;
    $$('#oMeals .tag').forEach(function (c) { c.classList.toggle('on', c === b); });
  };

  var og = $('#bOutGo');
  if (og) og.onclick = function () {
    var y = parseFloat($('#oYen').value);
    if (!(y > 0)) return toastErr('金額を入れてください');
    var payload = {
      date: $('#oDate').value || todayStr(), kind: S.expKind,
      name: $('#oName').value.trim(), yen: y, meal: S.expMeal, source: '手入力',
    };
    var oid = opId();
    og.disabled = true;
    call('addExpense', payload, oid).then(function (r) {
      og.disabled = false;
      if (!r || !r.ok) return toastErr((r && r.error) || '登録できませんでした');
      if (r.summary && r.summary.ym === S.ym) S.summary = r.summary;
      if (r.day) S.day = r.day;
      renderSummary(); renderFoot();
      S.buyLog.push({
        label: payload.name || payload.kind,
        sub: fmtMD(payload.date) + ' · ' + payload.kind + (payload.meal ? '（' + payload.meal + '）' : '') + ' · ' + yen(y),
        expenseIds: [r.expense.id],
      });
      renderBuy();
      toast(yen(y) + ' を登録しました');
    }).catch(function () {
      og.disabled = false;
      qPush({ action: 'addExpense', payload: payload, opId: oid });
      toast('通信できないので端末に保存しました', null, null, 5000, true);
    });
  };

  $$('#v-buy [data-undo]').forEach(function (b) {
    b.onclick = function () {
      var i = Number(b.dataset.undo), item = S.buyLog[i];
      if (!item) return;
      call('undo', { lotIds: item.lotIds || [], expenseIds: item.expenseIds || [] }, opId()).then(function (r) {
        if (!r || !r.ok) return toastErr('取り消せませんでした');
        S.buyLog.splice(i, 1);
        refresh(true); renderBuy();
        toast('取り消しました');
      });
    };
  });
}

/* -------------------------------------------------- 食材の新規登録・編集 */
function unitTagsHtml(sel) {
  var units = S.units.slice();
  if (sel && units.indexOf(sel) < 0) units.push(sel);
  return '<div class="tags" id="uTags">' +
    units.map(function (u) { return '<button class="tag' + (u === sel ? ' on' : '') + '" data-u="' + esc(u) + '">' + esc(u) + '</button>'; }).join('') +
    '<button class="tag mut" data-u="__other">その他…</button></div>' +
    '<input type="hidden" id="uVal" value="' + esc(sel || 'g') + '">';
}

function bindUnitTags() {
  var box = $('#uTags');
  if (!box) return;
  box.onclick = function (e) {
    var b = e.target.closest('[data-u]'); if (!b) return;
    if (b.dataset.u === '__other') {
      var cur = $('#uVal').value;
      var wrap = document.createElement('div');
      wrap.className = 'inw wide';
      wrap.style.marginTop = '8px';
      wrap.innerHTML = '<input id="uFree" placeholder="単位（例: 束・丁・杯）" value="' + esc(cur) + '" autocapitalize="off">';
      if (!$('#uFree')) box.parentNode.insertBefore(wrap, box.nextSibling);
      $('#uFree').oninput = function () { $('#uVal').value = this.value.trim() || 'g'; };
      $('#uFree').focus();
      $$('#uTags .tag').forEach(function (c) { c.classList.toggle('on', c === b); });
      return;
    }
    $('#uVal').value = b.dataset.u;
    $$('#uTags .tag').forEach(function (c) { c.classList.toggle('on', c === b); });
  };
}

function catTagsHtml(sel) {
  var cats = S.categories.filter(function (c) { return c !== '作り置き'; });
  return '<div class="tags" id="cTags">' +
    cats.map(function (c) { return '<button class="tag' + (c === sel ? ' on' : '') + '" data-c="' + esc(c) + '">' + esc(c) + '</button>'; }).join('') +
    '</div><input type="hidden" id="cVal" value="' + esc(sel || cats[0] || '') + '">';
}
function bindCatTags() {
  var box = $('#cTags');
  if (!box) return;
  box.onclick = function (e) {
    var b = e.target.closest('[data-c]'); if (!b) return;
    $('#cVal').value = b.dataset.c;
    $$('#cTags .tag').forEach(function (c) { c.classList.toggle('on', c === b); });
  };
}

function showFoodSheet(foodId) {
  var f = foodId ? foodById(foodId) : null;
  openSheet(
    '<h3>' + (f ? '食材を編集' : '新しい食材') + '</h3>' +
    '<label class="fld"><span>品名</span><div class="inw wide">' +
      '<input id="nName" placeholder="例: 納豆（3個パック）" value="' + esc(f ? f.name : '') + '" autocapitalize="off"></div></label>' +
    '<div class="fld"><span>置き場</span>' + catTagsHtml(f ? f.category : null) + '</div>' +
    '<div class="fld"><span>単位</span>' + unitTagsHtml(f ? f.unit : 'g') +
      '<em class="src blank">3個入りの納豆なら「個」で内容量3。半分使うものは「個」で0.5と入れられます</em></div>' +
    '<label class="fld"><span>表記ゆれ（レシート上の別名・カンマ区切り・あとで足せます）</span>' +
      '<div class="inw wide"><input id="nAlias" placeholder="豚小間切落とし,豚コマ" value="' + esc(f ? f.aliases : '') + '" autocapitalize="off"></div></label>' +
    '<div style="height:6px"></div>' +
    '<button class="btn" id="nGo">' + (f ? '保存する' : '登録する') + '</button>'
  );
  bindCatTags(); bindUnitTags();
  if (!f) setTimeout(function () { $('#nName').focus(); }, 100);

  $('#nGo').onclick = function () {
    var name = $('#nName').value.trim();
    if (!name) return;
    var body = { name: name, category: $('#cVal').value, unit: $('#uVal').value, aliases: $('#nAlias').value.trim(), tracked: true };
    $('#nGo').disabled = true;

    if (f) {
      body.id = f.id;
      call('updateFood', body, opId()).then(function (r) {
        $('#nGo').disabled = false;
        if (!r || !r.ok) return toastErr((r && r.error) || '保存できませんでした');
        closeSheet();
        refresh(true).then(function () { toast('保存しました'); });
      });
    } else {
      call('addFood', body, opId()).then(function (r) {
        $('#nGo').disabled = false;
        if (!r || !r.ok) return toastErr((r && r.error) || '登録できませんでした');
        if (!foodById(r.food.id)) S.foods.push(r.food);
        S.buyFood = r.food.id; S.buyQuery = '';
        closeSheet(); renderBuy(); window.scrollTo(0, 0);
        toast(r.duplicated ? '同じ品名がすでにありました' : name + ' を追加しました');
      });
    }
  };
}
function showEditFood(foodId) { showFoodSheet(foodId); }

/* ============================================================================
 * 【将来の拡張ポイント】レシートOCR（仕様書 7-1）
 *
 * OCRで品名・金額・日付を取り出したら、この関数に渡せば仕入に反映できる。
 * 追加が必要なのは「画像を読んで items を作る部分」だけで、
 * 登録の経路（addLots は複数件を一括で受ける / 由来列 / 過去日付）は用意済み。
 *
 *   applyReceiptDraft([{ name:'豚小間切落とし', yen:598, date:'2026-08-01' }, ...])
 *
 * name は食材マスタの「表記ゆれ」を通して正規化する。
 * 内容量はレシートに載らない前提なので、ここでは前回値を入れておく。
 * ==========================================================================*/
function normalizeFoodName(raw) {
  var s = String(raw || '').trim();
  for (var i = 0; i < S.foods.length; i++) {
    var f = S.foods[i];
    if (f.name === s) return f;
    var al = (f.aliases || '').split(/[,、]/).map(function (x) { return x.trim(); }).filter(Boolean);
    if (al.indexOf(s) >= 0) return f;
  }
  return null;
}
function applyReceiptDraft(items) {
  S.receiptDraft = (items || []).map(function (it) {
    var f = normalizeFoodName(it.name);
    return { raw: it.name, foodId: f ? f.id : null, name: f ? f.name : it.name,
             unit: f ? f.unit : 'g', qty: f ? f.lastQty : null,
             yen: it.yen, date: it.date || todayStr(), source: 'レシート読取' };
  });
  return S.receiptDraft;
}

/* ============================================================================
 * ライフサイクル
 * ==========================================================================*/
/* 設定リンクを同じ画面で開き直したとき（ハッシュだけが変わる＝再読み込みが起きない）に備える */
window.addEventListener('hashchange', function () {
  var o = cfgFromHash();
  if (o && o.t && o.t !== CFG.token) {
    CFG.url = o.u || CFG.url; CFG.token = o.t; saveCfg();
    location.reload();
  }
});

window.addEventListener('online', flushQueue);
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') {
    flushQueue();
    // 開きっぱなしで時間が経っている（日をまたいでいる）ことがあるので、日付と食事区分を今に合わせ直す
    rollDate();
    if (!S.mealTouched) S.meal = autoMeal();
    if (S.tab === 'buy') renderBuy(); else renderFridge();
    checkVersion(false);
    if (S._lastLoad && Date.now() - S._lastLoad > 10 * 60 * 1000) { S._lastLoad = Date.now(); refresh(true); }
  }
});
S._lastLoad = Date.now();

if ('serviceWorker' in navigator && location.protocol === 'https:' && !IS_GAS) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}

boot();
</script>
